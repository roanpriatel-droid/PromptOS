<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-label="The Productivity Pack">
  <defs>
    <linearGradient id="pr-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1ECDF"/>
      <stop offset="100%" stop-color="#D9D2BE"/>
    </linearGradient>
    <radialGradient id="pr-glow" cx="62%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#6B46C1" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#6B46C1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pr-cell-focus" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7E5BD8"/>
      <stop offset="100%" stop-color="#3E2780"/>
    </linearGradient>
    <linearGradient id="pr-cell-meta" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(31,18,64,0.10)"/>
      <stop offset="100%" stop-color="rgba(31,18,64,0.04)"/>
    </linearGradient>
    <filter id="pr-cell-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="g"/>
      <feMerge>
        <feMergeNode in="g"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="pr-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#1F1240" flood-opacity="0.18"/>
    </filter>
    <filter id="pr-noise">
      <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.20   0 0 0 0 0.16   0 0 0 0 0.30   0 0 0 0.06 0"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#pr-bg)"/>
  <rect width="1080" height="1080" fill="url(#pr-glow)"/>

  <!-- Wordmark + label (dark text on cream) -->
  <g transform="translate(72, 80)">
    <g>
      <path d="M0 8 L18 22 L0 36" fill="none" stroke="#EC4899" stroke-width="4" stroke-linecap="square"/>
      <rect x="24" y="6" width="4" height="32" fill="#1F1240"/>
      <text x="42" y="32" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600" letter-spacing="-0.3" fill="#1F1240">promptos</text>
    </g>
    <text x="0" y="76" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="2.8" fill="rgba(31,18,64,0.55)">THE PRODUCTIVITY PACK</text>
  </g>

  <!-- Vol number -->
  <g transform="translate(1008, 100)" text-anchor="end">
    <text font-family="'Instrument Serif', Georgia, serif" font-size="32" font-style="italic" fill="rgba(31,18,64,0.50)">Nº</text>
    <text x="0" y="42" font-family="'Instrument Serif', Georgia, serif" font-size="56" font-weight="500" fill="#1F1240">07</text>
  </g>

  <!-- Time-blocked grid. 6 cols × 5 rows, gap 12, cells 142×100 each, top-left at (84, 280). Cell (3,2) is focused. -->

  <!-- Grid container card -->
  <g transform="translate(540, 580)" filter="url(#pr-shadow)">
    <rect x="-470" y="-310" width="940" height="620" rx="20" fill="rgba(255,255,255,0.62)"/>
    <rect x="-470" y="-310" width="940" height="620" rx="20" fill="none" stroke="rgba(31,18,64,0.10)" stroke-width="1.5"/>

    <!-- Day headers -->
    <g font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2.4" fill="rgba(31,18,64,0.60)" text-anchor="middle">
      <text x="-385" y="-272">MON</text>
      <text x="-231" y="-272">TUE</text>
      <text x="-77" y="-272">WED</text>
      <text x="77" y="-272">THU</text>
      <text x="231" y="-272">FRI</text>
      <text x="385" y="-272">SAT</text>
    </g>

    <!-- Hour labels (left) -->
    <g font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="rgba(31,18,64,0.45)" text-anchor="end">
      <text x="-440" y="-188">09:00</text>
      <text x="-440" y="-76">11:00</text>
      <text x="-440" y="36">13:00</text>
      <text x="-440" y="148">15:00</text>
      <text x="-440" y="260">17:00</text>
    </g>

    <!-- 5 rows × 6 cols of "meta" cells (background lookalike), each 142×100, gap 12. Row Ys at -240, -128, -16, 96, 208. Col Xs at -456..+322 (start of cell). -->

    <!-- Helper: cells fill function inline. We list them all explicitly for crispness. -->
    <!-- Row 1 -->
    <rect x="-456" y="-240" width="142" height="100" rx="12" fill="url(#pr-cell-meta)"/>
    <rect x="-302" y="-240" width="142" height="100" rx="12" fill="url(#pr-cell-meta)"/>
    <rect x="-148" y="-240" width="142" height="100" rx="12" fill="url(#pr-cell-meta)"/>
    <rect x="6"    y="-240" width="142" height="100" rx="12" fill="url(#pr-cell-meta)"/>
    <rect x="160"  y="-240" width="142" height="100" rx="12" fill="url(#pr-cell-meta)"/>
    <rect x="314"  y="-240" width="142" height="100" rx="12" fill="url(#pr-cell-meta)"/>
    <!-- Row 2 -->
    <rect x="-456" y="-128" width="142" height="100" rx="12" fill="url(#pr-cell-meta)"/>
    <rect x="-302" y="-128" width="142" height="100" rx="12" fill="url(#pr-cell-meta)"/>
    <rect x="-148" y="-128" width="142" height="100" rx="12" fill="url(#pr-cell-meta)"/>
    <rect x="6"    y="-128" width="142" height="100" rx="12" fill="url(#pr-cell-meta)"/>
    <rect x="160"  y="-128" width="142" height="100" rx="12" fill="url(#pr-cell-meta)"/>
    <rect x="314"  y="-128" width="142" height="100" rx="12" fill="url(#pr-cell-meta)"/>
    <!-- Row 3 — THE FOCUS CELL replaces (col=3, x=6) -->
    <rect x="-456" y="-16" width="142" height="100" rx="12" fill="url(#pr-cell-meta)"/>
    <rect x="-302" y="-16" width="142" height="100" rx="12" fill="url(#pr-cell-meta)"/>
    <rect x="-148" y="-16" width="142" height="100" rx="12" fill="url(#pr-cell-meta)"/>
    <g filter="url(#pr-cell-glow)">
      <rect x="6" y="-16" width="142" height="100" rx="12" fill="url(#pr-cell-focus)"/>
    </g>
    <rect x="160"  y="-16" width="142" height="100" rx="12" fill="url(#pr-cell-meta)"/>
    <rect x="314"  y="-16" width="142" height="100" rx="12" fill="url(#pr-cell-meta)"/>
    <!-- Row 4 -->
    <rect x="-456" y="96" width="142" height="100" rx="12" fill="url(#pr-cell-meta)"/>
    <rect x="-302" y="96" width="142" height="100" rx="12" fill="url(#pr-cell-meta)"/>
    <rect x="-148" y="96" width="142" height="100" rx="12" fill="url(#pr-cell-meta)"/>
    <rect x="6"    y="96" width="142" height="100" rx="12" fill="url(#pr-cell-meta)"/>
    <rect x="160"  y="96" width="142" height="100" rx="12" fill="url(#pr-cell-meta)"/>
    <rect x="314"  y="96" width="142" height="100" rx="12" fill="url(#pr-cell-meta)"/>
    <!-- Row 5 -->
    <rect x="-456" y="208" width="142" height="100" rx="12" fill="url(#pr-cell-meta)"/>
    <rect x="-302" y="208" width="142" height="100" rx="12" fill="url(#pr-cell-meta)"/>
    <rect x="-148" y="208" width="142" height="100" rx="12" fill="url(#pr-cell-meta)"/>
    <rect x="6"    y="208" width="142" height="100" rx="12" fill="url(#pr-cell-meta)"/>
    <rect x="160"  y="208" width="142" height="100" rx="12" fill="url(#pr-cell-meta)"/>
    <rect x="314"  y="208" width="142" height="100" rx="12" fill="url(#pr-cell-meta)"/>

    <!-- Focus cell label content -->
    <g transform="translate(77, 34)" text-anchor="middle">
      <text font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="2.4" fill="rgba(250,248,245,0.85)" y="-20">DEEP WORK</text>
      <text font-family="'Instrument Serif', Georgia, serif" font-size="22" font-style="italic" fill="#FAF8F5" y="12">90 min</text>
    </g>

    <!-- Tiny scattered glyphs in a few neighboring cells to suggest "everything else" -->
    <g font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="rgba(31,18,64,0.42)">
      <text x="-440" y="-200">standup</text>
      <text x="-440" y="-88">inbox</text>
      <text x="-130" y="-88">brief</text>
      <text x="178"  y="-88">review</text>
      <text x="-440" y="136">lunch</text>
      <text x="-130" y="136">slack</text>
      <text x="178"  y="136">call</text>
      <text x="332"  y="136">ad-hoc</text>
      <text x="-440" y="248">errands</text>
    </g>
  </g>

  <!-- Bottom label (dark on cream) -->
  <g transform="translate(72, 1000)">
    <text font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="3" fill="rgba(31,18,64,0.55)">55 PROMPTS · 6 SECTIONS · .DOCX + PDF</text>
  </g>

  <!-- Noise overlay -->
  <rect width="1080" height="1080" filter="url(#pr-noise)" opacity="0.55"/>
</svg>
