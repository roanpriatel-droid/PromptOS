<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-label="The Web Design Agency Playbook">
  <defs>
    <linearGradient id="wd-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5E2D6"/>
      <stop offset="60%" stop-color="#E9C0B6"/>
      <stop offset="100%" stop-color="#C9748F"/>
    </linearGradient>
    <radialGradient id="wd-glow-pink" cx="65%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.30"/>
      <stop offset="70%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wd-frame-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6EE"/>
      <stop offset="100%" stop-color="#EEDFD0"/>
    </linearGradient>
    <linearGradient id="wd-frame-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEDE1"/>
      <stop offset="100%" stop-color="#F3D1C0"/>
    </linearGradient>
    <linearGradient id="wd-frame-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDDD2"/>
      <stop offset="100%" stop-color="#F0B3A4"/>
    </linearGradient>
    <linearGradient id="wd-hero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7E5BD8"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="wd-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#5A2839" flood-opacity="0.35"/>
    </filter>
    <filter id="wd-noise">
      <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.45   0 0 0 0 0.30   0 0 0 0 0.35   0 0 0 0.08 0"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#wd-bg)"/>
  <rect width="1080" height="1080" fill="url(#wd-glow-pink)"/>

  <g transform="translate(72, 80)">
    <g>
      <path d="M0 8 L18 22 L0 36" fill="none" stroke="#7A1245" stroke-width="4" stroke-linecap="square"/>
      <rect x="24" y="6" width="4" height="32" fill="#3A0A28"/>
      <text x="42" y="32" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600" letter-spacing="-0.3" fill="#3A0A28">promptos</text>
    </g>
    <text x="0" y="76" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="2.8" fill="rgba(58,10,40,0.65)">PLAYBOOK · WEB DESIGN AGENCY</text>
  </g>

  <g transform="translate(1008, 100)" text-anchor="end">
    <text font-family="'Instrument Serif', Georgia, serif" font-size="22" font-style="italic" fill="rgba(58,10,40,0.55)">PLAYBOOK</text>
    <text x="0" y="48" font-family="'Instrument Serif', Georgia, serif" font-size="64" font-weight="500" fill="#3A0A28">G3</text>
  </g>

  <!-- Three layered browser frames. Each one is smaller and offset; foremost is the smallest, gradient hero visible. Center anchor (540, 600). -->

  <!-- Background frame (largest, faintest) -->
  <g transform="translate(540, 660) rotate(-2)" filter="url(#wd-shadow)">
    <rect x="-360" y="-260" width="720" height="520" rx="14" fill="url(#wd-frame-1)"/>
    <rect x="-360" y="-260" width="720" height="520" rx="14" fill="none" stroke="rgba(58,10,40,0.10)" stroke-width="1.5"/>
    <!-- Title bar -->
    <g transform="translate(-360, -260)">
      <rect width="720" height="44" rx="14" fill="rgba(58,10,40,0.06)"/>
      <circle cx="22" cy="22" r="6" fill="rgba(122,18,69,0.45)"/>
      <circle cx="44" cy="22" r="6" fill="rgba(122,18,69,0.30)"/>
      <circle cx="66" cy="22" r="6" fill="rgba(122,18,69,0.18)"/>
    </g>
    <!-- Faint content bars -->
    <g fill="rgba(58,10,40,0.10)">
      <rect x="-300" y="-180" width="220" height="22" rx="6"/>
      <rect x="-300" y="-140" width="300" height="14" rx="4"/>
      <rect x="-300" y="-110" width="260" height="14" rx="4"/>
    </g>
  </g>

  <!-- Middle frame -->
  <g transform="translate(540, 600) rotate(1.5)" filter="url(#wd-shadow)">
    <rect x="-320" y="-230" width="640" height="460" rx="14" fill="url(#wd-frame-2)"/>
    <rect x="-320" y="-230" width="640" height="460" rx="14" fill="none" stroke="rgba(58,10,40,0.12)" stroke-width="1.5"/>
    <!-- Title bar -->
    <g transform="translate(-320, -230)">
      <rect width="640" height="40" rx="14" fill="rgba(58,10,40,0.08)"/>
      <circle cx="22" cy="20" r="6" fill="rgba(122,18,69,0.55)"/>
      <circle cx="44" cy="20" r="6" fill="rgba(122,18,69,0.40)"/>
      <circle cx="66" cy="20" r="6" fill="rgba(122,18,69,0.25)"/>
      <rect x="220" y="11" width="240" height="18" rx="9" fill="rgba(58,10,40,0.10)"/>
    </g>
    <!-- Content -->
    <g>
      <rect x="-280" y="-160" width="180" height="22" rx="6" fill="rgba(58,10,40,0.18)"/>
      <rect x="-280" y="-120" width="320" height="14" rx="4" fill="rgba(58,10,40,0.14)"/>
      <rect x="-280" y="-95"  width="240" height="14" rx="4" fill="rgba(58,10,40,0.14)"/>
      <!-- 2-col mock blocks -->
      <rect x="-280" y="-50" width="240" height="180" rx="10" fill="rgba(58,10,40,0.10)"/>
      <rect x="-20" y="-50" width="280" height="180" rx="10" fill="rgba(58,10,40,0.12)"/>
    </g>
  </g>

  <!-- Foreground frame (smallest, sharpest, real gradient hero visible) -->
  <g transform="translate(540, 530) rotate(-1)" filter="url(#wd-shadow)">
    <rect x="-280" y="-200" width="560" height="400" rx="14" fill="url(#wd-frame-3)"/>
    <rect x="-280" y="-200" width="560" height="400" rx="14" fill="none" stroke="rgba(58,10,40,0.18)" stroke-width="1.5"/>
    <!-- Title bar -->
    <g transform="translate(-280, -200)">
      <rect width="560" height="38" rx="14" fill="rgba(58,10,40,0.10)"/>
      <circle cx="22" cy="19" r="6" fill="#FF6B6B"/>
      <circle cx="44" cy="19" r="6" fill="#FFD166"/>
      <circle cx="66" cy="19" r="6" fill="#6BE7A1"/>
      <rect x="190" y="10" width="200" height="18" rx="9" fill="rgba(58,10,40,0.12)"/>
    </g>
    <!-- Hero gradient header inside the page -->
    <rect x="-240" y="-130" width="480" height="180" rx="10" fill="url(#wd-hero)" opacity="0.95"/>
    <text x="-220" y="-72" font-family="'Instrument Serif', Georgia, serif" font-size="40" font-weight="500" fill="#FAF8F5">Ship the site.</text>
    <text x="-220" y="-38" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" letter-spacing="0.4" fill="rgba(250,248,245,0.85)">Premium agency work, in three weeks, on a fixed fee.</text>
    <rect x="-220" y="-12" width="120" height="32" rx="16" fill="#FAF8F5"/>
    <text x="-160" y="9" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#7E5BD8">Start →</text>

    <!-- below-hero content blocks -->
    <rect x="-240" y="74" width="200" height="14" rx="4" fill="rgba(58,10,40,0.30)"/>
    <rect x="-240" y="98" width="270" height="14" rx="4" fill="rgba(58,10,40,0.22)"/>
    <rect x="-240" y="122" width="240" height="14" rx="4" fill="rgba(58,10,40,0.22)"/>
    <rect x="-240" y="146" width="180" height="14" rx="4" fill="rgba(58,10,40,0.22)"/>
  </g>

  <g transform="translate(72, 1000)">
    <text font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="3" fill="rgba(58,10,40,0.62)">140 PAGES · 12 TEMPLATES · 9 CHAPTERS</text>
  </g>

  <rect width="1080" height="1080" filter="url(#wd-noise)" opacity="0.55"/>
</svg>
